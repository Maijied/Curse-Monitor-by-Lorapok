name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Typecheck, test, validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate-template

  pages:
    name: Deploy marketing site (main only)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipping Pages deploy: set repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            echo "Optional: CLOUDFLARE_PAGES_PROJECT (default curse-monitor)."
            exit 0
          fi
          npx wrangler@4 pages deploy website --project-name="${CLOUDFLARE_PAGES_PROJECT:-curse-monitor}" --commit-dirty=true

  api-stub:
    name: Deploy API stub (optional)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker stub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_API_STUB: ${{ vars.DEPLOY_API_STUB }}
        run: |
          if [ "$DEPLOY_API_STUB" != "true" ]; then
            echo "Skipping API stub deploy. Set repository variable DEPLOY_API_STUB=true when you want this Worker published."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipping API stub deploy: Cloudflare secrets are not set."
            exit 0
          fi
          npx wrangler@4 deploy --config api/wrangler.jsonc
