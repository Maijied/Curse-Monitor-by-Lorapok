<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Ward — Lorapok Labs mascot (static)">
  <defs>
    <linearGradient id="ward-armor" x1="22" y1="14" x2="110" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4b5568"/>
      <stop offset="42%" stop-color="#1c2330"/>
      <stop offset="100%" stop-color="#2a3344"/>
    </linearGradient>
    <linearGradient id="ward-ring" x1="12" y1="12" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <radialGradient id="ward-eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b6ff8a"/>
      <stop offset="55%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#1a7a12"/>
    </radialGradient>
    <filter id="ward-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0a0a12"/>
  <circle cx="64" cy="64" r="58" stroke="url(#ward-ring)" stroke-width="2.4" fill="none" stroke-dasharray="7 5" opacity="0.92">
  </circle>
  <circle cx="64" cy="64" r="50" stroke="#6C5CE7" stroke-width="1" fill="none" opacity="0.28">
  </circle>
  <!-- antenna -->
  <path d="M64 28 V14" stroke="#6C5CE7" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="64" cy="12" r="4.2" fill="#39ff14" filter="url(#ward-glow)">
  </circle>
  <!-- body -->
  <ellipse cx="64" cy="96" rx="26" ry="16" fill="url(#ward-armor)" stroke="#4a5568" stroke-width="1.1"/>
  <ellipse cx="64" cy="82" rx="30" ry="18" fill="url(#ward-armor)" stroke="#4a5568" stroke-width="1.1"/>
  <!-- arms -->
  <path d="M38 84 Q28 92 30 104" stroke="#6C5CE7" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M90 84 Q100 92 98 104" stroke="#6C5CE7" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- head -->
  <ellipse cx="64" cy="54" rx="32" ry="30" fill="url(#ward-armor)" stroke="#6C5CE7" stroke-width="1.6"/>
  <ellipse cx="52" cy="44" rx="10" ry="6" fill="#ffffff" opacity="0.08"/>
  <!-- eyes -->
  <ellipse cx="52" cy="54" rx="9" ry="10.5" fill="#07090e" stroke="#39ff14" stroke-width="1.1"/>
  <ellipse cx="76" cy="54" rx="9" ry="10.5" fill="#07090e" stroke="#39ff14" stroke-width="1.1"/>
  <g filter="url(#ward-glow)">
    <circle cx="52" cy="55" r="4.4" fill="url(#ward-eye)">
    </circle>
    <circle cx="76" cy="55" r="4.4" fill="url(#ward-eye)">
    </circle>
  </g>
  <circle cx="50.4" cy="52.6" r="1.35" fill="#fff"/>
  <circle cx="74.4" cy="52.6" r="1.35" fill="#fff"/>
  <!-- cute ward smile -->
  <path d="M54 66 Q64 74 74 66" stroke="#39ff14" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.95"/>
</svg>
