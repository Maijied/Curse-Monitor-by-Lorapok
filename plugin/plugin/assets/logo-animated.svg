<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Curse Monitor by Lorapok">
  <defs>
    <linearGradient id="armor" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d4654"/>
      <stop offset="50%" stop-color="#1a1f28"/>
      <stop offset="100%" stop-color="#2b3340"/>
    </linearGradient>
    <linearGradient id="ring" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="65%" stop-color="#39ff14" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0a0a12"/>
  <circle cx="64" cy="64" r="58" stroke="url(#ring)" stroke-width="2.5" fill="none" stroke-dasharray="8 6" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="64" r="52" stroke="#6C5CE7" stroke-width="1" fill="none" opacity="0.35">
    <animate attributeName="r" values="50;54;50" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.45;0.2" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="64" cy="80" rx="34" ry="28" fill="url(#armor)" stroke="#4a5568" stroke-width="1.2"/>
  <ellipse cx="64" cy="54" rx="28" ry="24" fill="url(#armor)" stroke="#4a5568" stroke-width="1.2"/>
  <path d="M48 60 Q64 70 80 60" stroke="url(#ring)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M38 90 L32 104 M44 94 L38 110 M84 94 L90 110 M90 90 L96 104" stroke="#6C5CE7" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  <ellipse cx="64" cy="46" rx="26" ry="22" fill="url(#armor)" stroke="#6C5CE7" stroke-width="1.4"/>
  <ellipse cx="52" cy="44" rx="10" ry="11" fill="#0a0e14" stroke="#39ff14" stroke-width="1"/>
  <ellipse cx="76" cy="44" rx="10" ry="11" fill="#0a0e14" stroke="#39ff14" stroke-width="1"/>
  <g filter="url(#glow)">
    <circle cx="52" cy="44" r="7" fill="url(#eyeGlow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="76" cy="44" r="7" fill="url(#eyeGlow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="44" r="3.5" fill="#39ff14">
      <animate attributeName="cx" values="50;54;51;53;52" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="76" cy="44" r="3.5" fill="#39ff14">
      <animate attributeName="cx" values="74;78;75;77;76" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="42" r="1.2" fill="#fff" opacity="0.95"/>
    <circle cx="74" cy="42" r="1.2" fill="#fff" opacity="0.95"/>
  </g>
</svg>
