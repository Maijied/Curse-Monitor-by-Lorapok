<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Ward waving">
  <defs>
    <linearGradient id="w-armor" x1="40" y1="20" x2="210" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4b5568"/>
      <stop offset="45%" stop-color="#1c2330"/>
      <stop offset="100%" stop-color="#2a3344"/>
    </linearGradient>
    <linearGradient id="w-ring" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <filter id="w-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="104" stroke="url(#w-ring)" stroke-width="3" fill="none" stroke-dasharray="10 8" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="14s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="128" cy="228" rx="44" ry="8" fill="#39ff14" opacity="0.12"/>
  <path d="M128 58 V28" stroke="#6C5CE7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="128" cy="24" r="8" fill="#39ff14" filter="url(#w-glow)">
    <animate attributeName="r" values="7;9;7" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="128" cy="196" rx="48" ry="28" fill="url(#w-armor)" stroke="#4a5568" stroke-width="2"/>
  <ellipse cx="128" cy="168" rx="56" ry="32" fill="url(#w-armor)" stroke="#4a5568" stroke-width="2"/>
  <path d="M84 168 Q58 176 62 204" stroke="#6C5CE7" stroke-width="6" stroke-linecap="round" fill="none"/>
  <g>
    <path d="M172 168 Q210 140 218 168" stroke="#6C5CE7" stroke-width="6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 200 160;22 200 160;0 200 160" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
  <ellipse cx="128" cy="108" rx="62" ry="56" fill="url(#w-armor)" stroke="#6C5CE7" stroke-width="3"/>
  <ellipse cx="104" cy="108" rx="16" ry="18" fill="#07090e" stroke="#39ff14" stroke-width="2"/>
  <ellipse cx="152" cy="108" rx="16" ry="18" fill="#07090e" stroke="#39ff14" stroke-width="2"/>
  <circle cx="104" cy="110" r="8" fill="#39ff14" filter="url(#w-glow)"/>
  <circle cx="152" cy="110" r="8" fill="#39ff14" filter="url(#w-glow)"/>
  <circle cx="100" cy="104" r="2.4" fill="#fff"/>
  <circle cx="148" cy="104" r="2.4" fill="#fff"/>
  <path d="M108 132 Q128 148 148 132" stroke="#39ff14" stroke-width="4" stroke-linecap="round" fill="none"/>
