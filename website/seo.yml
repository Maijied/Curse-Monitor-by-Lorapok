# Source of truth for SEO — edited by humans; artifacts generated by scripts/generate-seo.mjs
site:
  base: https://curse.lorapok.tech
  locale: en_US
  author: Mohammad Maizied Hasan Majumder

openGraph:
  type: website
  image: /assets/og-social-card.svg

twitter:
  card: summary_large_image

pages:
  index:
    file: index.html
    path: /
    title: "Curse Monitor by Lorapok — Know your limits before they know you"
    description: >-
      Live Cursor usage for CLI + Grok Bot: quotas, bonus credits, Auto/API %,
      grouped reports, and billing cycle. Companion to Cursor Curse Monitor.
      Local-first auth. Not the VS Code extension.
    keywords:
      - Curse Monitor
      - Lorapok Labs
      - Cursor usage
      - CLI
      - Grok Bot
      - quota
      - billing
      - Auto
      - API
    changefreq: weekly
    priority: "1.0"
    ogTitle: "Curse Monitor by Lorapok"
    ogDescription: Live Cursor usage for CLI + agent plugin. Know your limits before they know you.
    twitterTitle: "Curse Monitor by Lorapok"
    twitterDescription: Quotas, bonus pool, Auto/API reports — local-first CLI + plugin.

  docs:
    file: docs.html
    path: /docs.html
    title: "Docs — Curse Monitor CLI & plugin | Lorapok"
    description: CLI reference for status, report, watch, json, whoami. Plugin install and auth notes.
    changefreq: weekly
    priority: "0.8"
    ogTitle: Docs — Curse Monitor
    ogDescription: CLI reference + Cursor agent plugin install.
    twitterTitle: Docs — Curse Monitor
    twitterDescription: Commands, auth, reports, and plugin layout.

  privacy:
    file: privacy.html
    path: /privacy.html
    title: Privacy — Curse Monitor by Lorapok
    description: Local Cursor token, never printed. No telemetry from the CLI.
    changefreq: monthly
    priority: "0.5"
    ogTitle: Privacy — Curse Monitor
    ogDescription: Local-first CLI. Tokens never leave your machine via this product's telemetry.
    twitterTitle: Privacy — Curse Monitor
    twitterDescription: Local token, never printed. No CLI telemetry.

  terms:
    file: terms.html
    path: /terms.html
    title: Terms — Curse Monitor by Lorapok
    description: Terms of use for Curse Monitor CLI and agent plugin by Lorapok Labs.
    changefreq: monthly
    priority: "0.4"
    ogTitle: Terms — Curse Monitor
    ogDescription: MIT-licensed CLI + plugin. Not affiliated with Anysphere / Cursor.
    twitterTitle: Terms — Curse Monitor
    twitterDescription: Terms of use for Curse Monitor by Lorapok Labs.

